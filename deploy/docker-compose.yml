# SimGuard production stack. This file holds the database only for now; the
# backend, frontend, ML and proxy services are added to it later.
#
# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml up -d
# Variables come from deploy/.env (copy deploy/.env.example, never commit it).
# Never run "down -v" on a live server: it deletes the data volume.
name: ${COMPOSE_PROJECT_NAME:-simguard}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SIMGUARD_DB_NAME:?set SIMGUARD_DB_NAME in deploy/.env}
      POSTGRES_USER: ${SIMGUARD_DB_OWNER:?set SIMGUARD_DB_OWNER in deploy/.env}
      POSTGRES_PASSWORD: ${SIMGUARD_DB_OWNER_PASSWORD:?set SIMGUARD_DB_OWNER_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
  pgbackups:
